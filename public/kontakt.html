<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kontakt – Stanisław Wiąckowski</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=EB+Garamond&display=swap" rel="stylesheet">
<style>
:root{--paper:#efe6d2;--ink:#3b2f22;--sepia:#8a6a43;--fern:#4e6b3a;--line:#c9b994}
*{box-sizing:border-box}
body{margin:0;background:var(--paper) repeating-linear-gradient(0deg,transparent 0 31px,#0000000a 31px 32px);color:var(--ink);font:19px/1.7 "EB Garamond",Georgia,serif}
.page{max-width:680px;margin:40px auto;padding:48px clamp(16px,6vw,72px);background:#f7f0de;border:1px solid var(--line);box-shadow:0 0 0 10px #f7f0de,0 0 0 11px var(--line),0 20px 60px #3b2f2230;text-align:center}
a{color:var(--fern)}
.back{display:block;text-align:left;font:italic 17px "Cormorant Garamond";text-decoration:none}
.plate{font:italic 15px "Cormorant Garamond";color:var(--sepia);letter-spacing:.15em;text-transform:uppercase}
h1{font:700 clamp(44px,8vw,64px)/1 "Cormorant Garamond",serif;color:var(--fern);margin:12px 0 18px}
.mail{display:inline-block;margin:22px 0 8px;color:var(--paper);background:var(--fern);padding:12px 30px;text-decoration:none;font:italic 22px "Cormorant Garamond";word-break:break-all}
footer{font:italic 15px "Cormorant Garamond";color:var(--sepia);margin-top:44px;border-top:1px solid var(--line);padding-top:20px}
</style>
</head>
<body><div class="page">
<a class="back" href="/">← powrót do strony głównej</a>
<span class="plate">Strona personalna</span>
<h1>Kontakt</h1>
<p>Pytania o książki, zamówienia lub dorobek profesora prosimy kierować mailowo.</p>
<a class="mail" href="mailto:stanislaw.wiackowski@gmail.com">stanislaw.wiackowski@gmail.com</a>
<footer>© 2026 Strona personalna Stanisława Wiąckowskiego. Wszelkie prawa zastrzeżone.</footer>
</div></body></html>
